name: Smoke checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile every Python file
        run: python -m compileall -q play.py games modules tools tests datapreprocessing
      - name: Parse Haunted Wall entry points
        run: python tests/smoke_test_haunted_wall.py
