name: Feature request
description: An idea for a game or an improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What would make the games better?
      description: Who plays, and what is missing or awkward today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your idea
      description: How it would look and play.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you thought of, and their tradeoffs.
